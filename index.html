function useStorage(key, def) {
  const [val, setVal] = useState(() => {
    try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : def; }
    catch { return def; }
  });
  useEffect(() => {
    try { localStorage.setItem(key, JSON.stringify(val)); } catch {}
  }, [key, val]);
  return [val, setVal];
}

function fmt(ts) {
  const d = Math.floor((Date.now()-ts)/86400000);
  if (d===0) return "today"; if (d===1) return "yesterday"; return `${d} days ago`;
}

// ── API KEY SCREEN ─────────────────────────────────────────────────────────
function ApiKeyScreen({onComplete}) {
  const [key,  setKey]  = useState("");
  const [err,  setErr]  = useState("");
  const [show, setShow] = useState(false);

  function save() {
    const k = key.trim();
    if (!k) { setErr("Please enter your API key."); return; }
    if (!k.startsWith("sk-ant-")) { setErr("That doesn't look like a valid Anthropic key (should start with sk-ant-)."); return; }
    localStorage.setItem("tether_api_key", k);
    onComplete();
  }

  return (
    <div style={{...sh.screen, minHeight:"100vh", display:"flex", flexDirection:"column", justifyContent:"center"}}>
      <div style={{fontSize:44, color:C.amber, marginBottom:28, lineHeight:1}}>◉</div>
      <h1 style={{...sh.serif, fontSize:36, fontWeight:400, color:C.text, marginBottom:12, lineHeight:1.15}}>Tether</h1>
      <p style={{...sh.body, fontSize:15, color:C.muted, lineHeight:1.85, marginBottom:36}}>
        To use The Witness, Tether needs your Anthropic API key. This is stored only on this device and never leaves it.
      </p>
      <p style={{...sh.body, ...sh.lbl, color:C.dim, marginBottom:10}}>Anthropic API Key</p>
      <div style={{position:"relative", marginBottom:12}}>
        <input
          type={show?"text":"password"}
          value={key}
          onChange={e=>{setKey(e.target.value);setErr("");}}
          placeholder="sk-ant-api03-..."
          style={{...sh.inp, marginBottom:0, paddingRight:52}}
        />
        <button onClick={()=>setShow(s=>!s)} style={{
          position:"absolute", right:12, top:"50%", transform:"translateY(-50%)",
          background:"none", border:"none", color:C.dim, cursor:"pointer", fontSize:12,
          fontFamily:"'Lora',Georgia,serif",
        }}>{show?"hide":"show"}</button>
      </div>
      {err && <p style={{...sh.body, fontSize:12, color:C.crisis, marginBottom:12, lineHeight:1.5}}>{err}</p>}
      <p style={{...sh.body, fontSize:12, color:C.dim, lineHeight:1.65, marginBottom:28}}>
        Get your key at <span style={{color:C.amber}}>platform.anthropic.com</span> → API Keys.
        The key is only needed for The Witness feature.
      </p>
      <button onClick={save} style={sh.btn(key.trim().length>10, C.amber)}>continue →</button>
    </div>
  );
}

// ── GUIDE ──────────────────────────────────────────────────────────────────
function Guide({config, color, onDone}) {
  const [phase, setPhase] = useState(0);
  const [cycle, setCycle] = useState(0);
  const [step,  setStep]  = useState(0);
  const [done,  setDone]  = useState(false);
  const gone = useRef(false);

  useEffect(() => {
    if (config.type !== "breath") return;
    gone.current = false;
    let pi=0, ci=0;
    function tick() {
      if (gone.current) return;
      setPhase(pi);
      setTimeout(()=>{
        if (gone.current) return;
        pi=(pi+1)%config.phases.length;
        if (pi===0){ci++;if(ci>=config.cycles){setDone(true);return;}setCycle(ci);}
        tick();
      }, config.phases[pi].duration*1000);
    }
    tick();
    return ()=>{gone.current=true;};
  }, []);

  useEffect(() => {
    if (config.type==="breath") return;
    gone.current=false;
    let si=0;
    function tick() {
      if (gone.current) return;
      setStep(si);
      setTimeout(()=>{
        if (gone.current) return;
        si++;if(si>=config.steps.length){setDone(true);return;}tick();
      }, config.steps[si].duration*1000);
    }
    tick();
    return ()=>{gone.current=true;};
  }, []);

  if (done) return (
    <div style={{textAlign:"center", padding:"40px 0", animation:"screenIn 0.5s ease"}}>
      <div style={{fontSize:48, marginBottom:20, color}}>✓</div>
      <p style={{...sh.serif, fontSize:22, fontStyle:"italic", color:C.text, marginBottom:28, lineHeight:1.4}}>
        {config.type==="breath"?"Your breath has done its work.":"You've arrived. Well done."}
      </p>
      <button onClick={onDone} style={sh.btn(true,color)}>done</button>
    </div>
  );

  if (config.type==="breath") {
    const p=config.phases[phase];
    return (
      <div style={{textAlign:"center", padding:"20px 0"}}>
        <p style={{...sh.body, fontSize:12, color:C.dim, letterSpacing:"0.1em", marginBottom:8}}>cycle {cycle+1} of {config.cycles}</p>
        <p style={{...sh.serif, fontSize:20, fontStyle:"italic", color, marginBottom:44}}>{p.name}</p>
        <div style={{display:"flex", justifyContent:"center", marginBottom:52}}>
          <div style={{
            width:160, height:160, borderRadius:"50%",
            border:`2px solid ${color}55`, background:color+"18",
            transform:`scale(${p.scale})`,
            transition:`transform ${p.duration}s ease-in-out`,
            display:"flex", alignItems:"center", justifyContent:"center",
          }}>
            <div style={{width:40, height:40, borderRadius:"50%", background:color+"44"}}/>
          </div>
        </div>
        <button onClick={onDone} style={{...sh.ghost, fontSize:12}}>stop</button>
      </div>
    );
  }

  const s=config.steps[step];
  return (
    <div style={{padding:"20px 0"}}>
      <p style={{...sh.body, fontSize:12, color:C.dim, letterSpacing:"0.1em", marginBottom:28}}>step {step+1} of {config.steps.length}</p>
      <p key={step} style={{...sh.body, fontSize:17, fontStyle:"italic", color:C.text, lineHeight:2.1, marginBottom:36, animation:"screenIn 0.6s ease"}}>{s.prompt}</p>
      <div style={{height:2, background:C.border, borderRadius:2, overflow:"hidden", marginBottom:32}}>
        <div key={`b${step}`} style={{height:"100%", background:color, width:"100%", animation:`fillBar ${s.duration}s linear forwards`}}/>
      </div>
      <button onClick={onDone} style={{...sh.ghost, fontSize:12}}>stop</button>
    </div>
  );
}

// ── WITNESS ────────────────────────────────────────────────────────────────
const WITNESS_SYS = `You are a compassionate witness for someone who has experienced trauma. Your only role is to receive what they share and reflect it back with genuine warmth and without judgment. Do NOT offer advice, suggest techniques, recommend therapy, reframe their experience, or use toxic positivity. ONLY acknowledge what they said, honour the weight of it, and make them feel genuinely heard. Write 3–5 sentences, warm and quiet. Begin with their actual experience. Never start with "I".`;

function WitnessScreen({setScreen}) {
  const [messages,setMessages] = useStorage("tether_witness",[]);
  const [text,setText]   = useState("");
  const [loading,setLoad]= useState(false);
  const endRef = useRef(null);

  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);

  async function submit() {
    if (!text.trim()||loading) return;
    const um={role:"user",content:text.trim()};
    const next=[...messages,um];
    setMessages(next);setText("");setLoad(true);
    try {
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{
          "Content-Type":"application/json",
          "x-api-key":getKey(),
          "anthropic-version":"2023-06-01",
          "anthropic-dangerous-direct-browser-access":"true",
        },
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,system:WITNESS_SYS,messages:next.slice(-12)}),
      });
      const d=await r.json();
      if (d.error) throw new Error(d.error.message);
      const reply=d.content?.[0]?.text||"Something went quiet. Please try again.";
      setMessages(m=>[...m,{role:"assistant",content:reply}]);
    } catch(e) {
      setMessages(m=>[...m,{role:"assistant",content:e.message?.includes("401")||e.message?.includes("auth")
        ?"Your API key doesn't seem to be working. Check it in Settings → Change API Key."
        :"I couldn't reach you just now. Please try again in a moment."}]);
    }
    setLoad(false);
  }

  return (
    <div style={{...sh.screen, paddingBottom:120}}>
      <div style={{display:"flex", justifyContent:"space-between", alignItems:"center"}}>
        <button style={sh.back} onClick={()=>setScreen("home")}>← home</button>
        {messages.length>0 && (
          <button onClick={()=>{if(window.confirm("Clear this conversation?"))setMessages([]);}}
            style={{...sh.body, fontSize:11, color:C.dim, background:"none", border:"none", cursor:"pointer", letterSpacing:"0.06em"}}>
            new session
          </button>
        )}
      </div>
      <div style={{marginTop:24, marginBottom:24}}>
        <div style={{fontSize:30, color:C.amber, marginBottom:14, lineHeight:1}}>◉</div>
        <h2 style={{...sh.serif,...sh.h2}}>The Witness</h2>
        <p style={{...sh.body,...sh.sub}}>Write what you're carrying. No advice. No fixing. Just to be heard.</p>
      </div>
      {messages.length>0 && (
        <div style={{display:"flex", flexDirection:"column", gap:14, marginBottom:24}}>
          {messages.map((m,i)=>(
            <div key={i} style={{display:"flex", justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
              <div style={{
                maxWidth:"85%",
                background:m.role==="user"?C.amberBg:C.surface,
                border:`1px solid ${m.role==="user"?C.amberRing:C.border}`,
                borderRadius:m.role==="user"?"18px 18px 4px 18px":"18px 18px 18px 4px",
                padding:"14px 18px",
              }}>
                <p style={{...sh.body, fontSize:14, fontStyle:m.role==="assistant"?"italic":"normal",
                  color:m.role==="user"?C.text:C.muted, lineHeight:1.85, margin:0}}>{m.content}</p>
              </div>
            </div>
          ))}
          {loading && (
            <div style={{display:"flex", justifyContent:"flex-start"}}>
              <div style={{...sh.card, borderRadius:"18px 18px 18px 4px", padding:"14px 20px"}}>
                <p style={{...sh.body, fontSize:13, fontStyle:"italic", color:C.dim, margin:0}}>holding what you shared...</p>
              </div>
            </div>
          )}
          <div ref={endRef}/>
        </div>
      )}
      <textarea value={text} onChange={e=>setText(e.target.value)}
        onKeyDown={e=>{if(e.key==="Enter"&&(e.metaKey||e.ctrlKey))submit();}}
        placeholder={messages.length?"say more...":"What's with you right now..."}
        rows={4} style={sh.ta}/>
      <button onClick={submit} disabled={!text.trim()||loading} style={sh.btn(text.trim()&&!loading,C.amber)}>
        {loading?"receiving...":"share this"}
      </button>
      <CrisisBar/>
    </div>
  );
}

// ── CONTAINER ──────────────────────────────────────────────────────────────
function ContainerScreen({setScreen}) {
  const [containers,setContainers]=useStorage("tether_containers",[]);
  const [tab,setTab]   =useState("new");
  const [step,setStep] =useState(1);
  const [text,setText] =useState("");
  const [vessel,setVessel]=useState(null);
  const [sealing,setSealing]=useState(false);
  const [opening,setOpening]=useState(null);
  const sealed=containers.filter(c=>c.status==="sealed");

  function seal(){setSealing(true);setTimeout(()=>{setContainers(p=>[{id:Date.now(),text,vessel,sealedAt:Date.now(),status:"sealed"},...p]);setSealing(false);setStep(3);},2200);}
  function reset(){setStep(1);setText("");setVessel(null);}
  function reseal(id){setContainers(p=>p.map(c=>c.id===id?{...c,status:"sealed"}:c));setOpening(null);}
  function release(id){setContainers(p=>p.map(c=>c.id===id?{...c,status:"released",releasedAt:Date.now()}:c));setOpening(null);}

  const v=VESSELS.find(x=>x.id===vessel);

  if(opening){
    const cont=containers.find(c=>c.id===opening);
    const ov=VESSELS.find(x=>x.id===cont?.vessel);
    return(
      <div style={{...sh.screen, paddingBottom:100, animation:"screenIn 0.4s ease"}}>
        <button style={sh.back} onClick={()=>setOpening(null)}>← back</button>
        <div style={{marginTop:28, marginBottom:28}}>
          <div style={{fontSize:52, color:C.dim, marginBottom:16, textAlign:"center"}}>{ov?.glyph}</div>
          <p style={{...sh.body,...sh.lbl, color:C.dim, textAlign:"center", marginBottom:20}}>sealed {fmt(cont.sealedAt)}</p>
          <div style={{...sh.card, borderColor:C.slateRing, background:C.slateBg, borderRadius:16, marginBottom:24}}>
            <p style={{...sh.body, fontSize:15, fontStyle:"italic", color:C.text, lineHeight:1.9, margin:0}}>"{cont.text}"</p>
          </div>
          <p style={{...sh.body, fontSize:14, color:C.muted, lineHeight:1.8, marginBottom:28}}>You've opened this. Take your time with it. When you're ready, choose what to do next.</p>
          <div style={{display:"flex", flexDirection:"column", gap:10}}>
            <button onClick={()=>reseal(opening)} style={{...sh.body,width:"100%",background:C.slateBg,border:`1px solid ${C.slateRing}`,borderRadius:50,padding:"14px",color:C.slate,fontSize:14,cursor:"pointer",letterSpacing:"0.06em"}}>re-seal it</button>
            <button onClick={()=>release(opening)} style={{...sh.body,width:"100%",background:"none",border:`1px solid ${C.border}`,borderRadius:50,padding:"14px",color:C.dim,fontSize:14,cursor:"pointer",letterSpacing:"0.06em"}}>release it — I'm ready to let this go</button>
          </div>
        </div>
        <CrisisBar/>
      </div>
    );
  }

  return(
    <div style={{...sh.screen, paddingBottom:100}}>
      <button style={sh.back} onClick={()=>setScreen("home")}>← home</button>
      <div style={{margin:"24px 0 24px"}}>
        <div style={{fontSize:30, color:C.slate, marginBottom:14, lineHeight:1}}>▣</div>
        <h2 style={{...sh.serif,...sh.h2}}>The Container</h2>
        <p style={{...sh.body,...sh.sub}}>Place something down safely. You can return to it — or not. You choose.</p>
      </div>
      <div style={{display:"flex", gap:8, marginBottom:28}}>
        {["new","sealed"].map(t=>(
          <button key={t} onClick={()=>{setTab(t);reset();}} style={{...sh.body,background:tab===t?C.slateBg:"none",border:`1px solid ${tab===t?C.slateRing:C.border}`,borderRadius:20,padding:"6px 18px",color:tab===t?C.slate:C.muted,fontSize:13,cursor:"pointer",letterSpacing:"0.06em"}}>
            {t==="sealed"?`sealed (${sealed.length})`:"new"}
          </button>
        ))}
      </div>
      {tab==="new"&&(
        <>
          {step===1&&(<div style={{animation:"screenIn 0.3s ease"}}>
            <p style={{...sh.body, fontSize:14, color:C.muted, marginBottom:14}}>What needs to be contained right now?</p>
            <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="A memory, a feeling, an image, a thought that won't leave..." rows={6} style={sh.ta}/>
            <button onClick={()=>setStep(2)} disabled={!text.trim()} style={sh.btn(text.trim(),C.slate)}>choose a vessel →</button>
          </div>)}
          {step===2&&(<div style={{animation:"screenIn 0.3s ease"}}>
            <p style={{...sh.body, fontSize:14, color:C.muted, marginBottom:20}}>Choose where to place it:</p>
            <div style={{display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:10, marginBottom:28}}>
              {VESSELS.map(vs=>(<button key={vs.id} onClick={()=>setVessel(vs.id)} style={{background:vessel===vs.id?C.slateBg:C.surface,border:`1px solid ${vessel===vs.id?C.slate+"88":C.border}`,borderRadius:14,padding:"18px 8px",cursor:"pointer",textAlign:"center",transition:"all 0.2s"}}>
                <div style={{fontSize:26,marginBottom:8,color:vessel===vs.id?C.slate:C.dim}}>{vs.glyph}</div>
                <div style={{...sh.body,fontSize:11,color:vessel===vs.id?C.slate:C.muted}}>{vs.label}</div>
              </button>))}
            </div>
            <button onClick={seal} disabled={!vessel||sealing} style={sh.btn(vessel&&!sealing,C.slate)}>{sealing?"sealing...":"place & seal"}</button>
          </div>)}
          {step===3&&(<div style={{textAlign:"center", animation:"screenIn 0.5s ease", paddingTop:10}}>
            <div style={{fontSize:64,marginBottom:24,color:C.slate,opacity:0.8}}>{v?.glyph}</div>
            <p style={{...sh.serif,fontSize:26,fontStyle:"italic",color:C.text,marginBottom:14,lineHeight:1.3}}>It's contained.</p>
            <p style={{...sh.body,fontSize:14,color:C.muted,lineHeight:1.85,marginBottom:24}}>It's in the {v?.label.toLowerCase()}. Sealed. You don't have to hold it right now.</p>
            <div style={{...sh.card,background:C.slateBg,borderColor:C.slateRing,borderRadius:14,marginBottom:24,textAlign:"left"}}>
              <p style={{...sh.body,fontSize:13,fontStyle:"italic",color:C.muted,lineHeight:1.8,margin:0}}>"{text.length>140?text.slice(0,140)+"…":text}"</p>
            </div>
            <button onClick={()=>{reset();setTab("sealed");}} style={{...sh.ghost,display:"inline-block",marginBottom:10}}>view all sealed →</button><br/>
            <button onClick={reset} style={{...sh.body,background:"none",border:"none",color:C.dim,fontSize:12,cursor:"pointer",marginTop:6}}>contain something else</button>
          </div>)}
        </>
      )}
      {tab==="sealed"&&(
        <div style={{animation:"screenIn 0.3s ease"}}>
          {sealed.length===0
            ?<p style={{...sh.body,fontSize:14,fontStyle:"italic",color:C.dim,lineHeight:1.8,textAlign:"center",paddingTop:20}}>Nothing sealed yet. When you contain something, it will rest here waiting.</p>
            :<div style={{display:"flex",flexDirection:"column",gap:12}}>
              {sealed.map(c=>{const cv=VESSELS.find(x=>x.id===c.vessel);return(
                <div key={c.id} style={{...sh.card,borderRadius:14}}>
                  <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",marginBottom:10}}>
                    <span style={{fontSize:22,color:C.dim}}>{cv?.glyph}</span>
                    <span style={{...sh.body,fontSize:11,color:C.dim}}>sealed {fmt(c.sealedAt)}</span>
                  </div>
                  <p style={{...sh.body,fontSize:13,fontStyle:"italic",color:C.muted,lineHeight:1.7,marginBottom:14}}>"{c.text.length>100?c.text.slice(0,100)+"…":c.text}"</p>
                  <button onClick={()=>setOpening(c.id)} style={{...sh.body,background:C.slateBg,border:`1px solid ${C.slateRing}`,borderRadius:20,padding:"6px 18px",color:C.slate,fontSize:12,cursor:"pointer",letterSpacing:"0.06em"}}>open this</button>
                </div>
              );})}
            </div>
          }
        </div>
      )}
      <CrisisBar/>
    </div>
  );
}

  if(active){

              <div style={{...sh.body,fontSize:14,color:C.text,lineHeight:1.4}}>{a.name}</div>
            </div>
            <div style={{display:"flex",gap:6,flexShrink:0}}>

          <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))} placeholder="Name this anchor" style={sh.inp}/>
          <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
            {SENSES.map(s=>(<button key={s.id} onClick={()=>setForm(f=>({...f,sense:s.id}))} style={{background:form.sense===s.id?s.color+"22":"none",border:`1px solid ${form.sense===s.id?s.color+"88":C.border}`,borderRadius:20,padding:"4px 14px",color:form.sense===s.id?s.color:C.muted,fontFamily:"'Lora',Georgia,serif",fontSize:12,cursor:"pointer",transition:"all 0.2s"}}>{s.label}</button>))}
          </div>
          <textarea value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))} placeholder="Describe this anchor in rich detail — what does it feel like, look like, sound like? The more specific, the stronger it becomes." rows={4} style={sh.ta}/>
          <div style={{display:"flex",gap:8}}>
            <button onClick={()=>{setAdding(false);setForm({name:"",sense:"sight",desc:""}); }} style={{...sh.ghost,flex:1}}>cancel</button>
            <button onClick={save} disabled={!form.name.trim()||!form.desc.trim()} style={{...sh.btn(form.name.trim()&&form.desc.trim(),C.terra),flex:2}}>save anchor</button>
          </div>
        </div>
      }
      <CrisisBar/>
    </div>
  );
}

}

// ── ROOT ───────────────────────────────────────────────────────────────────
function Tether() {
  const [screen,    setScreen]   = useState("home");
  const [hasKey,    setHasKey]   = useState(!!localStorage.getItem("tether_api_key"));
  const [onboarded, setOnboarded]= useStorage("tether_onboarded", false);
  const [checkins,  setCheckins] = useStorage("tether_checkins",  []);

  function resetKey(){localStorage.removeItem("tether_api_key");setHasKey(false);}

  if (!hasKey)    return <div style={{fontFamily:"'Lora',Georgia,serif",background:C.bg,color:C.text,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}><ApiKeyScreen onComplete={()=>setHasKey(true)}/></div>;
  if (!onboarded) return <div style={{fontFamily:"'Lora',Georgia,serif",background:C.bg,color:C.text,minHeight:"100vh",maxWidth:480,margin:"0 auto"}}><OnboardingScreen onComplete={()=>setOnboarded(true)}/></div>;

  return(
    <div style={{fontFamily:"'Lora',Georgia,serif",background:C.bg,color:C.text,minHeight:"100vh",maxWidth:480,margin:"0 auto",position:"relative"}}>
      <div style={{paddingBottom:88}}>
        {screen==="home"      && <HomeScreen      setScreen={setScreen} checkins={checkins} onResetKey={resetKey}/>}
        {screen==="witness"   && <WitnessScreen   setScreen={setScreen}/>}
        {screen==="nervous"   && <NervousScreen   setScreen={setScreen} checkins={checkins} setCheckins={setCheckins}/>}
        {screen==="container" && <ContainerScreen setScreen={setScreen}/>}
        {screen==="anchor"    && <AnchorScreen    setScreen={setScreen}/>}
      </div>
      <BottomNav screen={screen} setScreen={setScreen}/>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<Tether/>);
</script>
</body>
</html>
