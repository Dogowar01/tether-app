function useStorage(key,def){
  const [val,set]=useState(()=>{

}

// ── GUIDE ────────────────────────────────────────────────────────────────
function Guide({config,color,onDone}){
  const [phase,setPhase]=useState(0);
  const [cycle,setCycle]=useState(0);
  const [step, setStep] =useState(0);
  const [done, setDone] =useState(false);
  const gone=useRef(false);

  useEffect(()=>{
    if(config.type!=="breath")return;
    gone.current=false;let pi=0,ci=0;
    function tick(){
      if(gone.current)return;
      setPhase(pi);
      setTimeout(()=>{
        if(gone.current)return;
        pi=(pi+1)%config.phases.length;
        if(pi===0){ci++;if(ci>=config.cycles){setDone(true);return;}setCycle(ci);}
        tick();
      },config.phases[pi].dur*1000);
    }
    tick();
    return()=>{gone.current=true;};
  },[]);

  useEffect(()=>{
    if(config.type==="breath")return;
    gone.current=false;let si=0;
    function tick(){
      if(gone.current)return;
      setStep(si);
      setTimeout(()=>{
        if(gone.current)return;
        si++;if(si>=config.steps.length){setDone(true);return;}tick();
      },config.steps[si].dur*1000);
    }
    tick();
    return()=>{gone.current=true;};
  },[]);

  if(done)return(
    <div style={{textAlign:"center",padding:"48px 0"}}>
      <div style={{width:56,height:56,borderRadius:"50%",background:color+"20",
        border:`1.5px solid ${color}`,display:"flex",alignItems:"center",
        justifyContent:"center",margin:"0 auto 24px",fontSize:22,color}}><span>✓</span></div>
      <p style={{...serif,fontSize:22,fontStyle:"italic",color:C.text,lineHeight:1.4,marginBottom:32}}>
        {config.type==="breath"?"Your breath has done its work.":"You've arrived. Well done."}
      </p>
      <PrimaryBtn on color={color} onClick={onDone}>done</PrimaryBtn>
    </div>
  );

  if(config.type==="breath"){
    const p=config.phases[phase];
    return(
      <div style={{textAlign:"center",padding:"24px 0"}}>
        <Label color={C.dim} style={{marginBottom:8}}>cycle {cycle+1} of {config.cycles}</Label>
        <p style={{...serif,fontSize:22,fontStyle:"italic",color,marginBottom:48,minHeight:32}}>{p.name}</p>
        <div style={{display:"flex",justifyContent:"center",marginBottom:52}}>
          <div style={{
            width:164,height:164,borderRadius:"50%",
            border:`1.5px solid ${color}60`,background:`${color}10`,
            transform:`scale(${p.scale})`,
            transition:`transform ${p.dur}s ease-in-out`,
            display:"flex",alignItems:"center",justifyContent:"center",
          }}>
            <div style={{width:40,height:40,borderRadius:"50%",background:`${color}40`}}/>
          </div>
        </div>
        <GhostBtn onClick={onDone} style={{fontSize:12}}>stop</GhostBtn>
      </div>
    );
  }

  const s=config.steps[step];
  return(
    <div style={{padding:"16px 0"}}>
      <div style={{display:"flex",gap:4,marginBottom:28}}>
        {config.steps.map((_,i)=>(
          <div key={i} style={{flex:1,height:3,borderRadius:2,
            background:i<step?color:i===step?color+"80":C.border,transition:"background 0.3s"}}/>
        ))}
      </div>
      <p key={step} style={{...sans,fontSize:17,fontStyle:"italic",color:C.textSoft,
        lineHeight:2,marginBottom:28}}>{s.prompt}</p>
      <div style={{height:3,background:C.border,borderRadius:2,overflow:"hidden",marginBottom:36}}>
        <div key={`b${step}`} style={{height:"100%",background:color,width:"100%",
          animation:`fillBar ${s.dur}s linear forwards`}}/>
      </div>
      <GhostBtn onClick={onDone} style={{fontSize:12}}>stop</GhostBtn>
    </div>
  );
}

// ── WITNESS ──────────────────────────────────────────────────────────────
const WITNESS_SYS=`You are a compassionate witness for someone who has experienced trauma. Your only role is to receive what they share and reflect it back with genuine warmth and without judgment. Do NOT offer advice, suggest techniques, recommend therapy, reframe their experience, or use toxic positivity. ONLY acknowledge what they said, honour the weight of it, and make them feel genuinely heard. Write 3–5 sentences, warm and quiet. Begin with their actual experience. Never start with "I".`;

function WitnessScreen({setScreen}){
  const [messages,setMessages]=useStorage("tether_witness",[]);
  const [text,setText]=useState("");
  const [loading,setLoad]=useState(false);
  const endRef=useRef(null);
  useEffect(()=>{endRef.current?.scrollIntoView({behavior:"smooth"});},[messages,loading]);

  async function submit(){
    if(!text.trim()||loading)return;
    const um={role:"user",content:text.trim()};
    const next=[...messages,um];
    setMessages(next);setText("");setLoad(true);
    try{
      const r=await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:1000,
          system:WITNESS_SYS,messages:next.slice(-12)}),
      });
      const d=await r.json();
      setMessages(m=>[...m,{role:"assistant",content:d.content?.[0]?.text||"Something went quiet. Please try again."}]);
    }catch{
      setMessages(m=>[...m,{role:"assistant",content:"I couldn't reach you. Please try again."}]);
    }
    setLoad(false);
  }

  return(
    <div style={{padding:"52px 22px 140px",maxWidth:480,margin:"0 auto",background:C.bg}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:28}}>
        <BackBtn onClick={()=>setScreen("home")}/>
        {messages.length>0&&(
          <button onClick={()=>{if(window.confirm("Clear this conversation?"))setMessages([]);}}
            style={{...sans,background:"none",border:"none",color:C.dim,fontSize:12,cursor:"pointer"}}>
            new session
          </button>
        )}
      </div>
      <ScreenHead glyph="◉" color={C.amber} title="The Witness"
        sub="Write what you're carrying. No advice. No fixing. Just to be heard."/>

      {messages.length>0&&(
        <div style={{display:"flex",flexDirection:"column",gap:10,marginBottom:20}}>
          {messages.map((m,i)=>(
            <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
              <div style={{
                maxWidth:"86%",padding:"12px 16px",
                background:m.role==="user"?C.amberMid:C.surface,
                border:`1px solid ${m.role==="user"?C.amber+"30":C.border}`,
                borderRadius:m.role==="user"?"16px 16px 4px 16px":"16px 16px 16px 4px",
                boxShadow:"0 1px 3px rgba(100,70,40,0.06)",
              }}>
                <p style={{...sans,fontSize:14,lineHeight:1.85,
                  color:m.role==="user"?C.text:C.textSoft,
                  fontStyle:m.role==="assistant"?"italic":"normal",margin:0}}>
                  {m.content}
                </p>
              </div>
            </div>
          ))}
          {loading&&(
            <div style={{display:"flex"}}>
              <div style={{background:C.surface,border:`1px solid ${C.border}`,
                borderRadius:"16px 16px 16px 4px",boxShadow:"0 1px 3px rgba(100,70,40,0.06)"}}>
                <LoadingDots/>
              </div>
            </div>
          )}
          <div ref={endRef}/>
        </div>
      )}

      <textarea value={text} onChange={e=>setText(e.target.value)}
        placeholder={messages.length?"Continue...":"What's with you right now..."}
        rows={4} style={{...sans,width:"100%",background:C.surface,border:`1px solid ${C.border}`,
          borderRadius:14,padding:"14px 16px",color:C.text,fontSize:15,lineHeight:1.75,
          resize:"none",outline:"none",marginBottom:12,boxSizing:"border-box",
          boxShadow:"0 1px 3px rgba(100,70,40,0.06)"}}/>
      <PrimaryBtn on={!!(text.trim()&&!loading)} color={C.amber} onClick={submit}>
        {loading?"receiving...":"share this"}
      </PrimaryBtn>
      <CrisisBar/>
    </div>
  );
}

// ── STATE MAP ────────────────────────────────────────────────────────────
function NervousScreen({setScreen,checkins,setCheckins}){
  const [selected,setSelected]=useState(null);
  const [openTool,setOpenTool]=useState(null);
  const [showGuide,setGuide] =useState(false);

  function select(id){
    setSelected(id);setOpenTool(null);setGuide(false);
    setCheckins(p=>[{id:Date.now(),state:id,timestamp:Date.now()},...p].slice(0,30));
  }
  const ns=selected?NS.find(n=>n.id===selected):null;

  if(showGuide&&ns)return(
    <div style={{padding:"52px 22px 100px",maxWidth:480,margin:"0 auto",background:C.bg}}>
      <BackBtn onClick={()=>setGuide(false)}/>
      <div style={{margin:"24px 0 8px"}}>
        <Label color={ns.color} style={{marginBottom:6}}>{ns.guide.title}</Label>
        <h2 style={{...serif,fontSize:26,fontWeight:400,color:C.text,lineHeight:1.2}}>{ns.guide.subtitle}</h2>
      </div>
      <Guide config={ns.guide} color={ns.color} onDone={()=>setGuide(false)}/>
    </div>
  );

  return(
    <div style={{padding:"52px 22px 100px",maxWidth:480,margin:"0 auto",background:C.bg}}>
      <div style={{marginBottom:28}}><BackBtn onClick={()=>setScreen("home")}/></div>
      <ScreenHead glyph="≋" color={C.sage} title="State Map" sub="Where are you right now? No wrong answers."/>

      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:20}}>
        {NS.map(n=>(
          <button key={n.id} onClick={()=>select(n.id)} style={{
            background:selected===n.id?n.bg:C.surface,
            border:`1px solid ${selected===n.id?n.color+"40":C.border}`,
            borderRadius:16,padding:"16px 18px",textAlign:"left",cursor:"pointer",
            boxShadow:selected===n.id?`0 2px 12px ${n.color}20`:"0 1px 3px rgba(100,70,40,0.05)",
            transition:"all 0.2s",
          }}>
            <div style={{display:"flex",alignItems:"center",gap:14}}>
              <div style={{width:10,height:10,borderRadius:"50%",flexShrink:0,
                background:selected===n.id?n.color:C.dimmer,transition:"background 0.2s"}}/>
              <div>
                <p style={{...serif,fontSize:17,color:C.text,marginBottom:2}}>{n.label}</p>
                <p style={{...sans,fontSize:12,color:C.muted,fontStyle:"italic"}}>{n.sub}</p>
              </div>
            </div>
          </button>
        ))}
      </div>

      {ns&&(
        <div>
          <div style={{height:1,background:C.border,margin:"16px 0"}}/>
          <p style={{...sans,fontSize:14,color:C.muted,lineHeight:1.8,marginBottom:18}}>{ns.desc}</p>

          <button onClick={()=>setGuide(true)} style={{
            width:"100%",background:ns.bg,border:`1px solid ${ns.color}25`,borderRadius:16,
            padding:"18px",textAlign:"left",cursor:"pointer",marginBottom:8,
            display:"flex",alignItems:"center",justifyContent:"space-between",
            boxShadow:`0 2px 10px ${ns.color}14`,
          }}>
            <div>
              <Label color={ns.color} style={{marginBottom:5}}>guided practice</Label>
              <p style={{...serif,fontSize:17,color:C.text,marginBottom:2}}>{ns.guide.title}</p>
              <p style={{...sans,fontSize:12,color:C.muted,fontStyle:"italic"}}>{ns.guide.subtitle}</p>
            </div>
            <div style={{width:32,height:32,borderRadius:8,background:ns.color+"22",
              display:"flex",alignItems:"center",justifyContent:"center",
              color:ns.color,fontSize:13,flexShrink:0,marginLeft:12}}>▷</div>
          </button>

          <Label color={C.dim} style={{margin:"18px 0 8px"}}>or try these</Label>
          <div style={{display:"flex",flexDirection:"column",gap:6}}>
            {ns.tools.map((t,i)=>(
              <button key={i} onClick={()=>setOpenTool(openTool===i?null:i)} style={{
                background:openTool===i?ns.bg:C.surface,
                border:`1px solid ${openTool===i?ns.color+"30":C.border}`,
                borderRadius:12,padding:"13px 16px",textAlign:"left",cursor:"pointer",
                boxShadow:"0 1px 3px rgba(100,70,40,0.04)",transition:"all 0.2s",

                  fontWeight:openTool===i?500:400}}>{t.name}</p>

              </button>

          {checkins.length>1&&(

              <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                {checkins.slice(0,14).map((ci,i)=>{

            </>
          )}
        </div>
      )}
      <CrisisBar/>
    </div>
  );
}

// ── CONTAINER ────────────────────────────────────────────────────────────
function ContainerScreen({setScreen}){
  const [containers,setContainers]=useStorage("tether_containers",[]);
  const [tab,setTab]=useState("new");
  const [step,setStep]=useState(1);
  const [text,setText]=useState("");
  const [vessel,setVessel]=useState(null);
  const [sealing,setSealing]=useState(false);
  const [opening,setOpening]=useState(null);
  const sealed=containers.filter(c=>c.status==="sealed");

  function seal(){
    setSealing(true);
    setTimeout(()=>{
      setContainers(p=>[{id:Date.now(),text,vessel,sealedAt:Date.now(),status:"sealed"},...p]);
      setSealing(false);setStep(3);
    },2000);
  }
  function reset(){setStep(1);setText("");setVessel(null);}
  function reseal(id){setContainers(p=>p.map(c=>c.id===id?{...c,status:"sealed"}:c));setOpening(null);}
  function release(id){setContainers(p=>p.map(c=>c.id===id?{...c,status:"released",releasedAt:Date.now()}:c));setOpening(null);}
  const v=VESSELS.find(x=>x.id===vessel);

  if(opening){
    const cont=containers.find(c=>c.id===opening);
    const ov=VESSELS.find(x=>x.id===cont?.vessel);
    return(
      <div style={{padding:"52px 22px 100px",maxWidth:480,margin:"0 auto",background:C.bg}}>
        <BackBtn onClick={()=>setOpening(null)}/>
        <div style={{marginTop:28}}>
          <div style={{fontSize:48,color:C.slate,textAlign:"center",marginBottom:12,opacity:0.4}}>{ov?.glyph}</div>
          <Label color={C.dim} style={{textAlign:"center",marginBottom:18}}>sealed {fmt(cont.sealedAt)}</Label>
          <Card style={{marginBottom:22}}>
            <p style={{...sans,fontSize:15,fontStyle:"italic",color:C.textSoft,lineHeight:1.9,margin:0}}>"{cont.text}"</p>
          </Card>
          <p style={{...sans,fontSize:14,color:C.muted,lineHeight:1.8,marginBottom:24}}>
            You've opened this. Take your time. When you're ready, choose what to do next.
          </p>
          <div style={{display:"flex",flexDirection:"column",gap:8}}>
            <button onClick={()=>reseal(opening)} style={{width:"100%",background:C.slateBtn,
              border:"none",borderRadius:12,padding:"14px",
              color:"#0C1A30",fontSize:14,cursor:"pointer",fontWeight:600,
              boxShadow:`0 3px 14px ${C.slateBtn}60`}}>re-seal it</button>
            <button onClick={()=>release(opening)} style={{width:"100%",background:"none",
              border:`1px solid ${C.border}`,borderRadius:12,padding:"14px",
              color:C.muted,fontSize:14,cursor:"pointer"}}>release it — I'm ready to let this go</button>
          </div>
        </div>
        <CrisisBar/>
      </div>
    );
  }

  return(
    <div style={{padding:"52px 22px 100px",maxWidth:480,margin:"0 auto",background:C.bg}}>
      <div style={{marginBottom:28}}><BackBtn onClick={()=>setScreen("home")}/></div>
      <ScreenHead glyph="▣" color={C.slate} title="The Container"
        sub="Place something down safely. You choose if and when to return to it."/>

      <div style={{display:"flex",gap:0,marginBottom:22,background:C.surface,borderRadius:12,padding:4,
        boxShadow:"0 1px 3px rgba(100,70,40,0.06)"}}>
        {["new","sealed"].map(t=>(
          <button key={t} onClick={()=>{setTab(t);reset();}} style={{
            flex:1,padding:"8px 0",borderRadius:9,border:"none",
            background:tab===t?C.bgWarm:"none",
            color:tab===t?C.textSoft:C.muted,
            fontSize:13,cursor:"pointer",fontWeight:tab===t?500:400,transition:"all 0.2s",
          }}>{t==="sealed"?`Sealed (${sealed.length})`:"New"}</button>
        ))}
      </div>

      {tab==="new"&&(
        <>
          {step===1&&(
            <div>
              <p style={{...sans,fontSize:14,color:C.muted,marginBottom:12}}>What needs to be contained right now?</p>
              <textarea value={text} onChange={e=>setText(e.target.value)}
                placeholder="A memory, a feeling, an image, a thought that won't leave..."
                rows={6} style={{...sans,width:"100%",background:C.surface,border:`1px solid ${C.border}`,
                  borderRadius:14,padding:"14px 16px",color:C.text,fontSize:15,lineHeight:1.75,
                  resize:"none",outline:"none",marginBottom:14,boxSizing:"border-box",
                  boxShadow:"0 1px 3px rgba(100,70,40,0.06)"}}/>
              <PrimaryBtn on={!!text.trim()} color={C.slate} onClick={()=>setStep(2)}>Choose a vessel →</PrimaryBtn>
            </div>
          )}
          {step===2&&(
            <div>
              <p style={{...sans,fontSize:14,color:C.muted,marginBottom:16}}>Choose where to place it:</p>
              <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:8,marginBottom:22}}>
                {VESSELS.map(vs=>(
                  <button key={vs.id} onClick={()=>setVessel(vs.id)} style={{
                    background:vessel===vs.id?C.slateBg:C.surface,
                    border:`1px solid ${vessel===vs.id?C.slate+"50":C.border}`,
                    borderRadius:14,padding:"16px 8px",cursor:"pointer",textAlign:"center",
                    boxShadow:vessel===vs.id?`0 2px 8px ${C.slate}20`:"0 1px 3px rgba(100,70,40,0.04)",
                    transition:"all 0.2s",
                  }}>
                    <div style={{fontSize:24,marginBottom:6,color:vessel===vs.id?C.slate:C.dimmer}}>{vs.glyph}</div>
                    <div style={{...sans,fontSize:11,color:vessel===vs.id?C.slate:C.muted,
                      fontWeight:vessel===vs.id?500:400}}>{vs.label}</div>
                  </button>
                ))}
              </div>
              <PrimaryBtn on={!!(vessel&&!sealing)} color={C.slate} onClick={seal}>
                {sealing?"Sealing...":"Place & seal"}
              </PrimaryBtn>
            </div>
          )}
          {step===3&&(
            <div style={{textAlign:"center",paddingTop:8}}>
              <div style={{fontSize:56,marginBottom:18,color:C.slate,opacity:0.4}}>{v?.glyph}</div>
              <h3 style={{...serif,fontSize:26,fontStyle:"italic",color:C.text,marginBottom:10,lineHeight:1.3}}>
                It's contained.
              </h3>
              <p style={{...sans,fontSize:14,color:C.muted,lineHeight:1.85,marginBottom:22}}>
                In the {v?.label.toLowerCase()}. Sealed. You don't have to hold it right now.
              </p>
              <Card style={{marginBottom:22,textAlign:"left"}}>
                <p style={{...sans,fontSize:13,fontStyle:"italic",color:C.muted,lineHeight:1.8,margin:0}}>
                  "{text.length>140?text.slice(0,140)+"…":text}"
                </p>
              </Card>
              <GhostBtn onClick={()=>{reset();setTab("sealed");}} style={{marginBottom:10}}>View sealed →</GhostBtn>
              <br/>
              <button onClick={reset} style={{...sans,background:"none",border:"none",color:C.dimmer,
                fontSize:12,cursor:"pointer",marginTop:8}}>contain something else</button>
            </div>
          )}
        </>
      )}

      {tab==="sealed"&&(
        <div>
          {sealed.length===0
            ?<div style={{textAlign:"center",paddingTop:32}}>
                <div style={{fontSize:36,color:C.dimmer,marginBottom:14}}>▣</div>
                <p style={{...sans,fontSize:14,fontStyle:"italic",color:C.dim,lineHeight:1.8}}>
                  Nothing sealed yet. When you contain something, it rests here.
                </p>
              </div>
            :<div style={{display:"flex",flexDirection:"column",gap:10}}>
                {sealed.map(c=>{
                  const cv=VESSELS.find(x=>x.id===c.vessel);
                  return(
                    <Card key={c.id}>
                      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:10}}>
                        <span style={{fontSize:20,color:C.dimmer}}>{cv?.glyph}</span>
                        <span style={{...sans,fontSize:11,color:C.dim}}>sealed {fmt(c.sealedAt)}</span>
                      </div>
                      <p style={{...sans,fontSize:13,fontStyle:"italic",color:C.muted,lineHeight:1.7,marginBottom:14}}>
                        "{c.text.length>90?c.text.slice(0,90)+"…":c.text}"
                      </p>
                      <button onClick={()=>setOpening(c.id)} style={{background:C.slateBtn,
                        border:"none",borderRadius:20,padding:"6px 16px",
                        color:"#0C1A30",fontSize:12,cursor:"pointer",fontWeight:600,
                        boxShadow:`0 2px 10px ${C.slateBtn}60`}}>open this</button>
                    </Card>
                  );
                })}
              </div>
          }
        </div>
      )}
      <CrisisBar/>
    </div>
  );
}

// ── ANCHORS ──────────────────────────────────────────────────────────────
function AnchorScreen({setScreen}){
  const [anchors,setAnchors]=useStorage("tether_anchors",DEFAULT_ANCHORS);
  const [active, setActive] =useState(null);
  const [adding, setAdding] =useState(false);
  const [form,   setForm]   =useState({name:"",sense:"sight",desc:""});

  function save(){
    if(!form.name.trim()||!form.desc.trim())return;
    setAnchors(p=>[...p,{...form,id:Date.now()}]);
    setForm({name:"",sense:"sight",desc:""});setAdding(false);
  }

  if(active){
    const sense=SENSES.find(s=>s.id===active.sense);
    return(
      <div style={{minHeight:"100vh",background:C.bg,display:"flex",flexDirection:"column",
        justifyContent:"center",padding:"60px 32px 48px"}}>
        <Chip color={sense?.color}>{active.sense}</Chip>
        <h2 style={{...serif,fontSize:30,fontStyle:"italic",fontWeight:400,color:C.text,
          margin:"18px 0 22px",lineHeight:1.25}}>{active.name}</h2>
        <p style={{...sans,fontSize:17,color:C.textSoft,lineHeight:2.1,marginBottom:48}}>{active.desc}</p>
        <GhostBtn onClick={()=>setActive(null)} style={{alignSelf:"flex-start"}}>← return</GhostBtn>
      </div>
    );
  }

  return(
    <div style={{padding:"52px 22px 100px",maxWidth:480,margin:"0 auto",background:C.bg}}>
      <div style={{marginBottom:28}}><BackBtn onClick={()=>setScreen("home")}/></div>
      <ScreenHead glyph="⚓" color={C.terra} title="Anchors"
        sub="Your personal grounding points. Activate one when you need to return to yourself."/>

      <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:12}}>
        {anchors.map(a=>{
          const sense=SENSES.find(s=>s.id===a.sense);
          return(
            <Card key={a.id} style={{display:"flex",alignItems:"center",gap:14,padding:"14px 16px"}}>
              <div style={{flex:1,minWidth:0}}>
                <div style={{marginBottom:6}}><Chip color={sense?.color}>{a.sense}</Chip></div>
                <p style={{...sans,fontSize:14,color:C.text,lineHeight:1.4}}>{a.name}</p>
              </div>
              <div style={{display:"flex",gap:6,flexShrink:0}}>
                <button onClick={()=>setActive(a)} style={{background:C.terraBtn,
                  border:"none",borderRadius:20,padding:"6px 14px",
                  color:"#1C0804",fontSize:12,cursor:"pointer",fontWeight:600,
                  boxShadow:`0 2px 10px ${C.terraBtn}60`}}>activate</button>
                <button onClick={()=>setAnchors(p=>p.filter(x=>x.id!==a.id))} style={{background:"none",
                  border:`1px solid ${C.border}`,borderRadius:20,padding:"6px 10px",
                  color:C.dimmer,fontSize:12,cursor:"pointer"}}>×</button>
              </div>
            </Card>
          );
        })}
      </div>

      {!adding
        ?<button onClick={()=>setAdding(true)} style={{width:"100%",background:"none",
            border:`1.5px dashed ${C.border}`,borderRadius:14,padding:"14px",color:C.dim,
            fontSize:13,cursor:"pointer",marginBottom:8}}>+ add an anchor</button>
        :<Card style={{marginBottom:8}}>
            <input value={form.name} onChange={e=>setForm(f=>({...f,name:e.target.value}))}
              placeholder="Name this anchor"
              style={{...sans,width:"100%",background:C.surface2,border:`1px solid ${C.border}`,
                borderRadius:10,padding:"11px 14px",color:C.text,fontSize:14,
                outline:"none",marginBottom:12,boxSizing:"border-box"}}/>
            <div style={{display:"flex",gap:6,marginBottom:12,flexWrap:"wrap"}}>
              {SENSES.map(s=>(
                <button key={s.id} onClick={()=>setForm(f=>({...f,sense:s.id}))} style={{
                  background:form.sense===s.id?s.color+"18":"none",
                  border:`1px solid ${form.sense===s.id?s.color+"50":C.border}`,
                  borderRadius:20,padding:"5px 14px",color:form.sense===s.id?s.color:C.muted,
                  fontSize:12,cursor:"pointer",fontWeight:form.sense===s.id?500:400,transition:"all 0.2s",
                }}>{s.label}</button>
              ))}
            </div>
            <textarea value={form.desc} onChange={e=>setForm(f=>({...f,desc:e.target.value}))}
              placeholder="Describe this anchor in detail — what does it feel like, sound like, smell like?"
              rows={4} style={{...sans,width:"100%",background:C.surface2,border:`1px solid ${C.border}`,
                borderRadius:12,padding:"12px 14px",color:C.text,fontSize:14,lineHeight:1.75,
                resize:"none",outline:"none",marginBottom:12,boxSizing:"border-box"}}/>
            <div style={{display:"flex",gap:8}}>
              <GhostBtn onClick={()=>{setAdding(false);setForm({name:"",sense:"sight",desc:""}); }}
                style={{flex:1}}>Cancel</GhostBtn>
              <PrimaryBtn on={!!(form.name.trim()&&form.desc.trim())} color={C.terra} onClick={save}
                style={{flex:2}}>Save anchor</PrimaryBtn>
            </div>
          </Card>
      }
      <CrisisBar/>
    </div>
  );
}

// ── ROOT ─────────────────────────────────────────────────────────────────
function Tether(){
  const [screen,   setScreen]   =useState("home");
  const [onboarded,setOnboarded]=useStorage("tether_onboarded_v2",false);
  const [checkins, setCheckins] =useStorage("tether_checkins",[]);

  useEffect(()=>{
    const link=document.createElement("link");
    link.rel="stylesheet";
    link.href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400;500;600&display=swap";
    document.head.appendChild(link);
    const style=document.createElement("style");
    style.textContent=`
      @keyframes fillBar{from{width:0%}to{width:100%}}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
      *,*::before,*::after{box-sizing:border-box}
      body{background:#F5EFE6}
      button{transition:transform 0.12s,opacity 0.12s}
      button:active{transform:scale(0.96);opacity:0.85}
    `;
    document.head.appendChild(style);
  },[]);

  if(!onboarded)return(
    <div style={{background:C.bg,minHeight:"100vh"}}>
      <OnboardingScreen onComplete={()=>setOnboarded(true)}/>
    </div>
  );

  return(
    <div style={{background:C.bg,color:C.text,minHeight:"100vh",maxWidth:480,margin:"0 auto",position:"relative"}}>
      <div style={{paddingBottom:80}}>
        {screen==="home"      &&<HomeScreen      setScreen={setScreen} checkins={checkins}/>}
        {screen==="witness"   &&<WitnessScreen   setScreen={setScreen}/>}
        {screen==="nervous"   &&<NervousScreen   setScreen={setScreen} checkins={checkins} setCheckins={setCheckins}/>}
        {screen==="container" &&<ContainerScreen setScreen={setScreen}/>}
        {screen==="anchor"    &&<AnchorScreen    setScreen={setScreen}/>}
      </div>
      <BottomNav screen={screen} setScreen={setScreen}/>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById("root")).render(<Tether/>);
</script>
</body>
</html>
